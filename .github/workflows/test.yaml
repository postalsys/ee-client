on:
    push:
        branches:
            - master
    pull_request:

name: test

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        # Skip the release-please release commit, whose subject is
        # "chore(master): release X.Y.Z [skip-ci]". Anchor on the subject
        # prefix with startsWith - matching the whole message would also skip
        # any ordinary commit that merely mentions [skip-ci] in its body.
        # release.yaml is intentionally not guarded so publishing still runs.
        if: "${{ !startsWith(github.event.head_commit.message, 'chore(master): release') }}"
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x, latest]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            # Platform guard shared with the other EmailEngine dependencies. This package never
            # reaches pkg's CommonJS graph: EmailEngine serves index.js as a static ES module, so
            # the check is that a lone copy of index.js loads as one.
            - name: Check the static copy EmailEngine serves
              if: matrix.node-version != '20.x'
              run: npm run test:cjs
